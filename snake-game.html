<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MausBot Snake</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0c10;color:#c5c6c7;font-family:sans-serif;overflow:hidden;touch-action:none}.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}canvas{display:block;background:linear-gradient(180deg,#111318 0%,#0f1115 100%);box-shadow:0 0 40px rgba(0,0,0,0.6),inset 0 0 20px rgba(255,255,255,0.02);border-radius:14px;border:1px solid rgba(255,255,255,0.06);max-width:92vw;max-height:72vh;aspect-ratio:1/1}.hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 24px;pointer-events:none;z-index:10}.stat{font-size:1.15rem;font-weight:700;letter-spacing:0.5px;text-shadow:0 0 12px rgba(57,255,20,0.35)}.stat .v{color:#a4ff6a;text-shadow:0 0 14px hsla(110,95%,55%,0.45);font-variant-numeric:tabular-nums}.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,12,16,0.88);border-radius:14px;z-index:20;text-align:center}.overlay.open{display:flex}.overlay h1{margin:0 0 8px;font-size:2.6rem;color:#39ff14;text-shadow:0 0 20px rgba(57,255,20,0.5);letter-spacing:4px}.controls{display:grid;grid-template-columns:72px 72px 72px;grid-template-rows:72px 72px;gap:10px;margin-top:26px;pointer-events:auto}.btn{width:72px;height:72px;border-radius:16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.restart{margin-top:18px;padding:10px 26px;border-radius:10px;border:1px solid #39ff14;background:transparent;color:#39ff14;font-size:1rem;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><div class="hud"><div class="stat">SCORE <span class="v" id="score">0</span></div><div class="stat">BEST <span class="v" id="best">0</span></div><div class="stat">LEVEL <span class="v" id="level">1</span></div><button id="muteBtn">🔊</button></div><canvas id="game" width="600" height="600"></canvas><div class="overlay" id="overlay"><h1 id="ovTitle">GAME OVER</h1><p id="ovMsg">Final score <span id="ovScore">0</span></p><button class="restart" id="restartBtn">PLAY AGAIN</button><div class="fps" id="fps">60 FPS</div></div><div class="pause-overlay" id="pauseOverlay"><h1>PAUSED</h1><p>Press P to resume</p></div><div class="controls"><div class="btn up" data-dir="up">▲</div><div class="btn left" data-dir="left">◀</div><div class="btn down" data-dir="down">▼</div><div class="btn right" data-dir="right">▶</div></div><div class="hint">Arrow keys / WASD to move · P to pause · Touch buttons on mobile</div></div><script>const canvas=document.getElementById("game");const ctx=canvas.getContext("2d",{alpha:false});const COLS=30,ROWS=30;const TILE=canvas.width/COLS;let score=0,best=0;let gameOver=false,started=false;let paused=false;let powerUp=null;let powerUpTimer=0;let foodCount=0;let stepMs=100;let baseStepMs=100;try{best=parseInt(localStorage.getItem("snake_best")||"0",10)||0}catch(e){}const DIRS={up:{x:0,y:-1,opp:"down"},down:{x:0,y:1,opp:"up"},left:{x:-1,y:0,opp:"right"},right:{x:1,y:0,opp:"left"}};let snake=[],vel={x:0,y:0},nextVel={x:0,y:0},food={x:15,y:15};let acc=0,lastTime=0,rafId,alpha=0;let shake=0,particles=[];function reset(){const cx=Math.floor(COLS/2),cy=Math.floor(ROWS/2);snake=[{x:cx,y:cy},{x:cx,y:cy},{x:cx,y:cy}];vel={x:0,y:0};nextVel={x:0,y:0};score=0;levelEl.textContent="1";baseStepMs=100;stepMs=100;foodCount=0;powerUp=null;powerUpTimer=0;paused=false;gameOver=false;started=false;overlay.classList.remove("open");shake=0;particles.length=0;placeFood();acc=0;lastTime=performance.now();alpha=0;loop(lastTime)}function placeFood(){let tries=0;do{food.x=Math.floor(Math.random()*COLS);food.y=Math.floor(Math.random()*ROWS);tries++}while(snake.some(s=>s.x===food.x&&s.y===food.y)&&tries<1000)}function spawnPowerUp(){if(powerUp)return;let tries=0;do{powerUp={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};tries++}while((powerUp.x===food.x&&powerUp.y===food.y)||snake.some(s=>s.x===powerUp.x&&s.y===powerUp.y)&&tries<1000);powerUpTimer=400;const el=document.createElement("div");el.id="powerUpEl";el.className="power-up";document.querySelector(".wrap").appendChild(el)}function setDir(dir){if(gameOver||paused)return;const d=DIRS[dir];if(!d)return;if(vel.x===0&&vel.y===0){nextVel=d;return}if(d.opp===dirOf(vel))return;nextVel=d}function dirOf(v){for(const k in DIRS){const d=DIRS[k];if(d.x===v.x&&d.y===v.y)return k}return null}window.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k==="arrowup"||k==="w")setDir("up");else if(k==="arrowdown"||k==="s")setDir("down");else if(k==="arrowleft"||k==="a")setDir("left");else if(k==="arrowright"||k==="d")setDir("right");else if(k==="p"){paused=!paused;pauseOverlay.classList.toggle("open",paused);if(!paused){lastTime=performance.now();loop(lastTime)}}else if(k===" "||k==="enter"){if(gameOver)reset();else if(!started)started=true}e.preventDefault()},{passive:false});function tick(){if(!started||gameOver)return;if(nextVel.x!==0||nextVel.y!==0)vel=nextVel;if(vel.x===0&&vel.y===0)return;const head={x:snake[0].x+vel.x,y:snake[0].y+vel.y};if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){die();return}if(snake.some(s=>s.x===head.x&&s.y===head.y)){die();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;foodCount++;if(foodCount%8===0)spawnPowerUp();if(score>best){best=score;try{localStorage.setItem("snake_best",String(best))}catch(e){}}const lvl=Math.floor(score/50)+1;levelEl.textContent=lvl;baseStepMs=Math.max(40,100-Math.floor(score/50)*10);stepMs=powerUpTimer>0?baseStepMs*2:baseStepMs;placeFood()}else{snake.pop()}if(powerUp&&head.x===powerUp.x&&head.y===powerUp.y){collectPowerUp();score+=25}}function die(){gameOver=true;shake=12;ovTitle.textContent="GAME OVER";ovMsg.textContent="Final score";ovScore.textContent=score;overlay.classList.add("open");cancelAnimationFrame(rafId);rafId=null}function collectPowerUp(){powerUpTimer=0;powerUp=null;const el=document.getElementById("powerUpEl");if(el)el.remove();stepMs=Math.max(40,stepMs-20);document.body.classList.add("slow-mo");setTimeout(()=>{document.body.classList.remove("slow-mo")},3000)}function loop(now){const dt=now-lastTime;lastTime=now;if(started&&!gameOver&&!paused){acc+=dt;const tickMs=powerUpTimer>0?stepMs*2:stepMs;while(acc>=tickMs){tick();acc-=tickMs}alpha=acc/tickMs}rafId=requestAnimationFrame(loop)}reset()</script></body></html>
